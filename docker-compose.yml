version: "3.9"

services:
  api:
    build: .
    container_name: senamhi-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/senamhi.db
      - SECRET_KEY=dev-secret-key-change-in-production
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    restart: unless-stopped
